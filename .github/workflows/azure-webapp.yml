name: Build and deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: kiln-web        # must match the App Service name
  NODE_VERSION: '22.x'

permissions:
  id-token: write                    # required for OIDC login (no stored secrets)
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Install production dependencies only, so the artefact matches what runs.
      - run: npm ci --omit=dev
      - run: npm test --if-present

      # node_modules is included in the artefact, which lets you turn Oryx build
      # off on the App Service side and get much faster, more predictable deploys.
      - name: Package
        run: zip -r release.zip . -x '.git/*' '.github/*' 'infra/*' '*.zip'

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Deploy to the staging slot, let it warm up, then swap. A swap is
      # near-instant and reversible; a direct push to production is neither.
      - name: Deploy to staging slot
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: staging
          package: release.zip

      - name: Swap staging into production
        run: |
          az webapp deployment slot swap \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --slot staging --target-slot production
